# Compila para Windows e gera o instalador e a versão portátil.
# - Tag "v*" (ex.: v0.1.0): publica uma Release com os arquivos.
# - Push na main ou execução manual: só gera os arquivos como artefato do workflow.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Testes
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Versão
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $base = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            $v = "$base-dev.$env:GITHUB_RUN_NUMBER"
          }
          $num = ($v -split "-")[0]
          if (($num -split "\.").Count -lt 4) { $num = "$num.0" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "NUM_VERSION=$num" >> $env:GITHUB_ENV
          "Versão: $v ($num)"

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" "/DNumVersion=$env:NUM_VERSION" installer\painel-led.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Versão portátil (zip)
        shell: pwsh
        run: |
          $dir = "dist\painel-led-$env:APP_VERSION"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\painel-led.exe, target\release\painel-led-mcp.exe, LICENSE, README.md $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\painel-led-$env:APP_VERSION-portatil.zip" -Force
          Remove-Item -Recurse $dir
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      - uses: actions/upload-artifact@v5
        with:
          name: painel-led-${{ env.APP_VERSION }}-windows
          path: dist/*

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Como instalar

          Baixe **painel-led-$env:APP_VERSION-instalador.exe** e execute. Não precisa de administrador.

          Depois, clique com o botão direito no painel (ou no ícone da bandeja) → **Configurações** → aba **Conectar ao Claude** para ligar o MCP, os hooks e a statusline.

          A versão **portátil (.zip)** roda sem instalar: descompacte e abra ``painel-led.exe``.

          > O executável não é assinado digitalmente; o Windows SmartScreen pode avisar na primeira vez. Clique em **Mais informações → Executar assim mesmo**.
          "@
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "Painel LED $env:APP_VERSION" --notes $notes --generate-notes
