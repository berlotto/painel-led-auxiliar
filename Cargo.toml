[package]
name = "painel-led"
version = "0.1.0"
edition = "2024"
default-run = "painel-led"
description = "Painel de LED virtual sempre no topo: hora, sistema, internet, agenda e Claude Code"
license = "MIT"
repository = "https://github.com/berlotto/painel-led-auxiliar"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
softbuffer = "0.4.8"
sysinfo = "0.40.3"
tiny_http = "0.12.0"
toml = "1.2.1"
tray-icon = "0.26.1"
ureq = "3.5.2"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
