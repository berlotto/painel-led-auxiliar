[package]
name = "painel-led"
version = "0.3.0"
edition = "2024"
default-run = "painel-led"
description = "Painel de LED virtual sempre no topo: hora, sistema, internet, agenda e Claude Code"
license = "MIT"
repository = "https://github.com/berlotto/painel-led-auxiliar"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
softbuffer = "0.4.8"
sysinfo = "0.40.3"
tiny_http = "0.12.0"
toml = "1.2.1"
# No Linux, o backend "ksni" fala com a bandeja direto pelo D-Bus (StatusNotifierItem), sem GTK:
# evita o glib 0.18 (RUSTSEC-2024-0429) e as dependências de GTK/AppIndicator.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = "3.5.2"
# Sem "wayland-csd-adwaita" (bordas desenhadas no Wayland): o painel não tem bordas, e esse
# recurso puxava o ttf-parser, sem manutenção (RUSTSEC-2026-0192).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reservar a faixa da tela no X11 (_NET_WM_STRUT_PARTIAL). Mesma versão que o winit já usa.
x11rb = "0.13"

# Pacote .deb (cargo deb). As dependências de bibliotecas são calculadas sozinhas ($auto);
# as do X11 são carregadas em tempo de execução pelo winit, por isso vão à parte.
[package.metadata.deb]
name = "painel-led"
maintainer = "Sérgio Berlotto Jr"
copyright = "2026, Sérgio Berlotto Jr"
extended-description = "Letreiro de LED virtual sempre no topo: hora, data, CPU/RAM, estabilidade da internet, Google Agenda, sessões e limites do Claude Code, servidor MCP e API HTTP local."
section = "utils"
priority = "optional"
depends = "$auto, libx11-6, libxcursor1, libxi6, libxrandr2, libxkbcommon-x11-0"
recommends = "curl"
assets = [
  ["target/release/painel-led", "usr/bin/", "755"],
  ["target/release/painel-led-mcp", "usr/bin/", "755"],
  ["assets/painel-led.desktop", "usr/share/applications/", "644"],
  ["assets/painel-led.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
  ["README.md", "usr/share/doc/painel-led/", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
